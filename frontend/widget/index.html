<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay Widget Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .hero {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }
        p {
            font-size: 1.25rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to My Website</h1>
        <p>Look at the bottom right corner of your screen! The Relay Chat Widget has been seamlessly embedded into this page using a single script tag.</p>
    </div>

    <!-- Inject Relay Widget -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script 
        src="widget.js" 
        data-tenant-id="demo_tenant" 
        data-api-url="http://localhost:8000">
    </script>
</body>
</html>
